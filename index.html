<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ICONIC">
<meta name="theme-color" content="#000000">
<title>ICONIC</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="Image%20PNG.png">
<link rel="icon" href="Image%20PNG.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--c1:#121212;--c2:#181818;--ln:#262626;--lg:#3a3115;--g:#d4af37;--g2:#f3dfa2;--g3:#f6e3a8;--tx:#ededed;--mu:#a3a3a3;--ok:#7fd6a3;--wa:#f0b65a;--ko:#ff8a80;--red:#e2574c;--top:env(safe-area-inset-top);--bot:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#000}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button,a{font-family:inherit}
.serif{font-family:Cinzel,Georgia,serif}
.mu{color:var(--mu);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.sb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wrap{padding:calc(14px + var(--top)) 20px calc(110px + var(--bot));max-width:640px;margin:0 auto}
h2{font-family:Cinzel,Georgia,serif;color:var(--g2);font-size:16px;letter-spacing:1px;font-weight:600;margin:22px 0 10px}
.card{background:var(--c1);border:1px solid var(--ln);border-radius:16px;padding:14px}
.card.gold{border-color:var(--lg)}
.hero{border-radius:22px;padding:16px 18px;background:linear-gradient(150deg,#2a210a 0%,#121212 58%);border:1px solid var(--lg);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,240,190,.08) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.2s .5s ease-out}
.big{font-family:Cinzel,Georgia,serif;color:var(--g3);font-size:36px;line-height:1.15}
.ib{width:44px;height:44px;flex:none;border-radius:14px;background:#141414;border:1px solid #2b2410;display:flex;align-items:center;justify-content:center;position:relative;color:var(--g2);cursor:pointer}
.ib svg{width:20px;height:20px}
.badge{position:absolute;top:-5px;right:-5px;background:var(--g);color:#111;font-size:11px;font-weight:700;border-radius:10px;padding:2px 6px;animation:pulse 2s infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 14px;border-radius:12px;border:0;background:linear-gradient(135deg,#f6e3a8,#c9a24a);color:#111;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;transition:transform .12s}
.btn:active,.ib:active,.tap:active{transform:scale(.96)}
.btn.sec{background:transparent;color:var(--g2);border:1px solid var(--lg)}
.btn.ghost{background:transparent;color:#d6d6d6;border:1px solid #2f2f2f}
.btn.red{background:var(--red);color:#fff}
.btn.redo{background:transparent;color:var(--ko);border:1px solid rgba(226,87,76,.5)}
.btn.wa{background:#25d366;color:#05230f}
.btn.full{width:100%;min-height:52px;border-radius:16px;font-size:15px}
.btn.sm{min-height:38px;padding:8px 12px;font-size:13px;border-radius:10px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--lg);color:var(--g2);white-space:nowrap}
.t-ok{color:var(--ok);border-color:rgba(79,191,131,.4)}.t-wa{color:var(--wa);border-color:rgba(232,163,61,.45)}.t-ko{color:var(--ko);border-color:rgba(226,87,76,.45)}.t-bl{color:#8fb4ff;border-color:rgba(143,180,255,.4)}
.task{display:flex;align-items:center;gap:12px;background:var(--c1);border:1px solid var(--ln);border-radius:16px;padding:10px 12px;margin-bottom:8px;transition:transform .35s,opacity .35s,max-height .35s,margin .35s,padding .35s;max-height:120px;overflow:hidden}
.task.out{transform:translateX(110%);opacity:0;max-height:0;margin:0;padding-top:0;padding-bottom:0;border-width:0}
.ico{width:40px;height:40px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ico svg{width:20px;height:20px}
.av{width:44px;height:44px;flex:none;border-radius:50%;background:#1a1a1a;color:var(--g2);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
.av.g{background:linear-gradient(135deg,#f6e3a8,#c9a24a);color:#111}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #1d1d1d}
.list-item:first-child{border-top:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:8px 14px;border-radius:20px;border:1px solid #2f2f2f;background:transparent;color:#cfcfcf;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:rgba(212,175,55,.14);border-color:var(--g);color:var(--g3)}
.seg{display:flex;gap:4px;padding:4px;background:var(--c1);border:1px solid var(--ln);border-radius:14px}
.seg button{flex:1;white-space:nowrap;min-height:38px;border-radius:10px;border:0;background:transparent;color:#8a8a8a;font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:#2a210a;color:var(--g3)}
input,select,textarea{width:100%;background:#0c0c0c;border:1px solid var(--lg);color:var(--tx);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;margin:4px 0 12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g)}
label.l{display:block;font-size:12px;color:var(--mu);letter-spacing:.3px}
.bar{height:6px;border-radius:6px;background:#262626;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--g);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.anim{animation:fadeUp .5s both}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;height:calc(78px + var(--bot));padding-bottom:var(--bot);background:rgba(0,0,0,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid #2b2410;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;padding-top:9px}
nav button{background:none;border:0;color:#8a8a8a;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav button.on{color:var(--g2)}
nav svg{width:22px;height:22px}
.fab{width:58px;height:58px;margin:-26px auto 0;border-radius:20px;transform:rotate(45deg);border:0;background:linear-gradient(135deg,#f6e3a8,#c9a24a);box-shadow:0 8px 24px rgba(212,175,55,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s}
.fab:active{transform:rotate(45deg) scale(.92)}
.fab svg{transform:rotate(-45deg);width:24px;height:24px}
#ov{position:fixed;inset:0;z-index:20;pointer-events:none}
.screen{position:absolute;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;pointer-events:auto;animation:slideIn .32s cubic-bezier(.2,.8,.2,1)}
.screen.closing{animation:slideOut .25s ease-in forwards}
.shead{display:flex;align-items:center;gap:12px;padding:calc(12px + var(--top)) 20px 0}
.mbg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:640px;max-height:90vh;overflow-y:auto;background:#111;border-top:1px solid var(--g);border-radius:26px 26px 0 0;padding:12px 20px calc(28px + var(--bot));animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet.danger{border-top-color:var(--red)}
.grab{width:40px;height:5px;border-radius:5px;background:#333;margin:0 auto 16px}
.toast{position:fixed;left:16px;right:16px;top:calc(10px + var(--top));z-index:60;background:#1c1c1c;border:1px solid var(--lg);border-radius:16px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.6);animation:down .3s;max-width:600px;margin:0 auto}
.toast.err{border-color:var(--red)}
.toast .in{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:14px}
.toast .pg{height:3px;background:#262626}.toast .pg i{display:block;height:3px;background:var(--g);width:100%}
.acces{background:#0b0b0b;border:1px dashed var(--g);border-radius:14px;padding:12px;font-size:14px;-webkit-user-select:text;user-select:text}
.acces div{padding:3px 0}
.sk{border-radius:16px;background:linear-gradient(90deg,#141414 25%,#1e1e1e 50%,#141414 75%);background-size:200% 100%;animation:shimmer 1.3s infinite}
.place{border-radius:16px;padding:14px;min-height:96px;background:var(--c1);border:1px solid var(--lg);cursor:pointer;transition:transform .12s}
.place:active{transform:scale(.97)}
.place.free{background:rgba(79,191,131,.07);border-color:rgba(79,191,131,.35)}
.place.prep{background:transparent;border:1px dashed rgba(232,163,61,.6)}
.place.warn{border-color:rgba(232,163,61,.6)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--g)}
.dot.p{animation:pulse 1.6s infinite}
.bars{height:170px;display:flex;align-items:flex-end;gap:10px;padding:14px 14px 0;background:#101010;border:1px solid var(--ln);border-radius:18px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;cursor:pointer}
.bars .b i{width:100%;border-radius:8px 8px 3px 3px;background:#3a3115;height:0;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.bars .b.on i{background:linear-gradient(180deg,#f6e3a8,#c9a24a);box-shadow:0 0 18px rgba(212,175,55,.35)}
.bars .b span{font-size:11px;color:var(--mu);padding-bottom:10px}
.spark path.l{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s .2s ease-out forwards}
.spark circle{animation:pulse 1.8s 1.4s infinite;opacity:0;animation-fill-mode:forwards}
.swipe{position:relative;height:62px;border-radius:31px;background:#141414;border:1px solid var(--lg);display:flex;align-items:center;justify-content:center;color:#c9b77a;font-size:14px;overflow:hidden;touch-action:none}
.swipe .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(212,175,55,.15);width:0}
.swipe .knob{position:absolute;left:6px;top:6px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#f6e3a8,#c9a24a);display:flex;align-items:center;justify-content:center;cursor:grab;z-index:2}
.swipe .lbl{animation:glow 2.4s infinite}
.lock{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 28%,#2a210a 0%,#070707 55%);display:flex;flex-direction:column;align-items:center;padding-top:calc(70px + var(--top))}
.gem{width:54px;height:54px;border:2px solid var(--g);transform:rotate(45deg);background:radial-gradient(circle at 35% 35%,#fff7d6,#e7c66a 25%,#7a5c14 60%,#120d02 85%);box-shadow:0 0 40px rgba(212,175,55,.55);animation:gem 2.4s ease-in-out infinite}
.gem.sm{width:22px;height:22px;box-shadow:0 0 14px rgba(212,175,55,.45)}
.dots{display:flex;gap:16px;margin-top:16px}
.dots span{width:14px;height:14px;border-radius:50%;border:1.5px solid #6b5a22;transition:all .15s}
.dots span.on{background:var(--g);border-color:var(--g);transform:scale(1.15)}
.dots.shake{animation:shake .4s}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:18px 28px;margin-top:36px}
.pad button{width:72px;height:72px;border-radius:50%;font-size:26px;color:#f3f3f3;background:rgba(255,255,255,.06);border:1px solid #2b2410;cursor:pointer}
.pad button:active{background:rgba(212,175,55,.25)}
.pad button.t{background:transparent;border:0;font-size:13px;color:#c9b77a}
.splash{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
.splash .word{font-family:Cinzel,serif;font-size:30px;letter-spacing:8px;color:var(--g2);margin-top:34px;animation:fadeUp .8s .2s both}
.splash .sub{font-size:10px;letter-spacing:8px;color:var(--g);margin-top:6px;animation:fadeUp .8s .4s both}
.check{width:120px;height:120px;position:relative;margin:0 auto}
.check .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--g);box-shadow:0 0 50px rgba(212,175,55,.45);animation:pop .5s both}
.check path{stroke-dasharray:90;stroke-dashoffset:90;animation:draw .6s .35s ease-out forwards}
.check .sp{position:absolute;width:7px;height:7px;background:var(--g3);transform:rotate(45deg);opacity:0;animation:spark .9s .5s ease-out forwards}
.empty{text-align:center;color:var(--mu);padding:26px 10px;font-size:14px}
.cu{font-variant-numeric:tabular-nums}
.masked{letter-spacing:2px}
details summary{cursor:pointer;color:var(--g2);font-size:13.5px;list-style:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{from{transform:translateY(-140%)}}
@keyframes slideIn{from{transform:translateX(100%)}}
@keyframes slideOut{to{transform:translateX(100%)}}
@keyframes shine{to{transform:translateX(100%)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.75}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes gem{0%,100%{box-shadow:0 0 30px rgba(212,175,55,.45)}50%{box-shadow:0 0 55px rgba(255,225,140,.8)}}
@keyframes pop{from{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}to{transform:scale(1);opacity:1}}
@keyframes spark{0%{opacity:0;transform:translate(0,0) rotate(45deg) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(45deg) scale(1)}}
@keyframes glow{0%,100%{opacity:.65}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="splash" id="splash"><div class="gem"></div><div class="word">ICONIC</div><div class="sub">COLLECTION</div></div>
<div id="main"></div>
<nav id="nav" style="display:none"></nav>
<div id="ov"></div>
<div id="modal"></div>
<div id="lockbox"></div>

<script>
/* ═════════ ICONIC Collection · application v2 ═════════ */
const APP_VERSION = '2.3.1';
const LS = {
  get(k, d) { try { const v = localStorage.getItem('iconic_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('iconic_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('iconic_' + k); } catch (e) {} }

let CFG = LS.get('cfg', null);
let D = null, IX = {}, TAB = (location.hash || '').replace('#', '') || 'accueil';
let MASK = LS.get('masque', false), FIRST = true, STACK = [], GPERIOD = 6, GSEL = 0, CFILTRE = 'actifs', RECH = '', CSEG = 'comptes';
if (!['accueil', 'clients', 'comptes', 'gains', 'valider'].includes(TAB)) TAB = 'accueil';

/* ---------- outils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => String(Math.round(Number(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const F = n => num(n) + ' F';
const M = n => MASK ? '<span class="masked">••••• F</span>' : F(n);
const CU = (n, pre) => MASK ? '<span class="masked">••••• F</span>' : `<span class="cu" data-v="${Math.round(Number(n || 0))}" data-pre="${pre || ''}">${pre || ''}${F(n)}</span>`;
const dt = iso => { if (!iso) return '—'; const d = new Date(iso); if (isNaN(d)) return '—'; return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear(); };
const dtl = iso => { if (!iso) return '—'; const d = new Date(iso); const m = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.']; return d.getUTCDate() + ' ' + m[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
const jours = j => j === 0 ? "aujourd'hui" : j > 0 ? `dans ${j} j` : `il y a ${-j} j`;
const ini = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0] || '').join('').toUpperCase();
const daysTo = iso => iso ? Math.round((new Date(iso) - new Date(D.aujourdhui)) / 864e5) : null;
const todayIso = () => new Date().toISOString().slice(0, 10);
const isoDay = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toISOString().slice(0, 10); };
const icons = {

  diamond: '<path d="M12 3l8 9-8 9-8-9z"/>', users: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M16 5a3 3 0 0 1 0 6M18 14c2 .6 3 2.7 3 6"/>',
  box: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 4v5"/>', chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', inbox: '<path d="M4 13h4l2 3h4l2-3h4"/><path d="M5 5h14l1 8v6H4v-6z"/>', search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  back: '<path d="M15 5l-7 7 7 7"/>', eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff: '<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/>',
  userx: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M16 11h6"/>', card: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',

async function call(action, data, cfg) {
  cfg = cfg || CFG;
  if (action !== 'load' && !['reglages', 'app', 'bloquer'].includes(action) && !(data && data.confirmer === false)) data = Object.assign({}, data || {}, { _load: 1 });
  let res;
  try { res = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ key: cfg.key, action, data: data || {} }) }); }
  catch (e) { throw 'Pas de connexion. Vérifie Internet et réessaie.'; }
  let j;
  try { j = await res.json(); } catch (e) { throw 'Réponse inattendue du serveur. As-tu déployé la nouvelle version du code ?'; }
  if (!j.ok) throw j.erreur || 'Erreur';
  if (data && data._load && j.data && j.data.load) { appliquer(j.data.load); return j.data.r; }
  return j.data;
}
let LAST_LOAD = 0;
function appliquer(d) {
  D = d; LAST_LOAD = Date.now(); LS.set('cache', D); indexer();
  if (!LOCKED) { render(); renderOverlay(); }
}
function indexer() {
  IX = { cl: {}, cp: {}, pl: {}, ca: {}, ab: {}, se: {} };
  D.clients.forEach(x => IX.cl[x.id] = x); D.comptes.forEach(x => IX.cp[x.id] = x); D.places.forEach(x => IX.pl[x.id] = x);
  D.cartes.forEach(x => IX.ca[x.id] = x); D.abos.forEach(x => IX.ab[x.id] = x); D.sessions.forEach(x => IX.se[x.code] = x);
}
let loading = null;
async function refresh(quiet, force) {
  if (!CFG) return;
  if (loading) return loading;
  if (quiet && !force && Date.now() - LAST_LOAD < 4000) return;
  loading = (async () => {
    try {
      appliquer(await call('load'));
    } catch (e) {
      if (String(e).indexOf('Accès refusé') >= 0) { LS.del('cfg'); CFG = null; return vConnexion("Ta clé n'est plus valide. Colle à nouveau ton lien."); }
      if (!quiet || !D) toast(String(e), true);
    } finally { loading = null; }
  })();
  return loading;
}
async function act(action, data, msg, opts) {
  opts = opts || {};
  busy(true);
  try {
    const r = await call(action, data);
    busy(false);
    if (opts.undo) undoToast(msg, opts.undo); else if (msg) toast(msg);
    refresh(true);
    return r;
  } catch (e) { busy(false); toast(String(e), true); throw e; }
}
let busyEl = null, busyT = null;

}

/* ---------- toasts et annulation ---------- */
let toastEl = null, toastT = null;
function toast(msg, err) {

  toastEl.innerHTML = `<div class="in">${I(err ? 'warn' : 'check', err ? '#ff8a80' : '#7fd6a3').replace('<svg', '<svg width="20" height="20"')}<span style="flex:1">${esc(msg)}</span></div>`;
  document.body.appendChild(toastEl);

}
function undoToast(msg, fn) {
  clearTimeout(toastT); if (toastEl) toastEl.remove();
  const el = document.createElement('div'); el.className = 'toast'; toastEl = el;
  el.innerHTML = `<div class="in">${I('check', '#7fd6a3').replace('<svg', '<svg width="20" height="20"')}<span style="flex:1">${esc(msg)}</span><button class="btn sec sm" style="border:0;color:var(--g3);font-weight:700">ANNULER</button></div><div class="pg"><i></i></div>`;
  document.body.appendChild(el);
  const bar = el.querySelector('.pg i'); bar.animate([{ width: '100%' }, { width: '0%' }], { duration: 10000, easing: 'linear' });
  el.querySelector('button').onclick = async () => { el.remove(); try { busy(true); await fn(); busy(false); toast('Action annulée'); refresh(true); } catch (e) { busy(false); toast(String(e), true); } };

}

function after(root) {

  });

function bindSwipe() {
  const sw = $('#sw'); if (!sw || sw.dataset.b) return; sw.dataset.b = 1;
  const k = sw.querySelector('.knob'), f = sw.querySelector('.fill');
  let x0 = null, max = 0;
  const pos = x => { const d = Math.max(0, Math.min(max, x)); k.style.transform = `translateX(${d}px)`; f.style.width = (d + 56) + 'px'; return d; };
  k.addEventListener('pointerdown', e => { x0 = e.clientX; max = sw.clientWidth - 62; k.setPointerCapture(e.pointerId); k.style.transition = 'none'; });
  k.addEventListener('pointermove', e => { if (x0 != null) pos(e.clientX - x0); });
  const end = e => {
    if (x0 == null) return; const d = e.clientX - x0; x0 = null; k.style.transition = 'transform .25s'; f.style.transition = 'width .25s';
    if (d > max * .82) { pos(max); validerCourant(); } else { pos(0); setTimeout(() => f.style.width = '0', 250); }
  };
  k.addEventListener('pointerup', end); k.addEventListener('pointercancel', end);
}
new MutationObserver(() => bindSwipe()).observe(document.getElementById('ov'), { childList: true, subtree: true });

}

function normN(n) {
  let x = String(n || '').trim(), plus = x.startsWith('+');
  x = x.replace(/\D/g, '');
  if (x.startsWith('00')) { x = x.slice(2); plus = true; }
  if (x.length > 8 && x.startsWith('226')) return x.slice(3);
  if (plus || x.length !== 8) return '';   // numéro étranger ou incomplet : ignoré
  return x;
}
function nrm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function lev(a, b) {
  const m = a.length, n = b.length; if (!m || !n) return m || n;
  let p = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const q = [i]; for (let j = 1; j <= n; j++) q[j] = Math.min(p[j] + 1, q[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = q; }
  return p[n];
}
function simNom(a, b) {
  a = nrm(a); b = nrm(b); if (!a || !b) return 0; if (a === b) return 100;
  const ta = a.split(' ').filter(w => w.length > 1), tb = b.split(' ').filter(w => w.length > 1);
  if (!ta.length || !tb.length) return 0;
  const mot = (w, v) => { if (w === v) return 1; if ((v.startsWith(w) || w.startsWith(v)) && Math.min(w.length, v.length) >= 3) return .85;
    const r = 1 - lev(w, v) / Math.max(w.length, v.length); return r >= .7 ? r : 0; };
  const cote = (x, y) => x.reduce((s, w) => s + Math.max(...y.map(v => mot(w, v))), 0) / x.length;
  return Math.round(100 * (.7 * cote(ta, tb) + .3 * cote(tb, ta)));
}
function decodeV(key, v) {
  if (/QUOTED-PRINTABLE/i.test(key)) { try { const by = []; v.replace(/=\r?\n/g, '').replace(/=([0-9A-F]{2})|([^=])/gi, (_, h, c) => { if (h) by.push(parseInt(h, 16)); else by.push(...new TextEncoder().encode(c)); }); v = new TextDecoder().decode(new Uint8Array(by)); } catch (e) {} }

function parseVcf(txt) {
  txt = txt.replace(/\r?\n[ \t]/g, '');
  const out = []; let cur = null;
  txt.split(/\r?\n/).forEach(line => {
    if (/^BEGIN:VCARD/i.test(line)) cur = { nom: '', surnom: '', tels: [] };
    else if (/^END:VCARD/i.test(line)) { if (cur && cur.tels.length && (cur.nom || cur.surnom)) out.push(cur); cur = null; }
    else if (cur) {
      const i = line.indexOf(':'); if (i < 0) return;
      const key = line.slice(0, i), k = key.toUpperCase().replace(/^ITEM\d+\./, ''), val = decodeV(key, line.slice(i + 1));
      if (k === 'FN' || k.startsWith('FN;')) cur.nom = val;
      else if ((k === 'N' || k.startsWith('N;')) && !cur.nom) { const p = val.split(';'); cur.nom = [p[1], p[0]].filter(Boolean).join(' ').trim(); }
      else if (k === 'NICKNAME' || k.startsWith('NICKNAME;')) cur.surnom = val;
      else if (k === 'TEL' || k.startsWith('TEL;')) { const n = normN(val); if (n && !cur.tels.includes(n)) cur.tels.push(n); }
    }
  });
  return out;
}
function garderContacts(l) {
  const vus = {}, out = [];
  l.forEach(c => { const k = nrm(c.nom || c.surnom) + '|' + c.tels.join(','); if (!vus[k]) { vus[k] = 1; out.push({ n: c.nom || c.surnom, s: c.nom && c.surnom ? c.surnom : '', t: c.tels }); } });
  LS.set('contacts', { le: new Date().toISOString(), l: out }); CT = { skip: [], pick: {} };
  return out.length;
}
function lireVcf(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { const n = garderContacts(parseVcf(String(r.result || ''))); toast(n ? n + ' contacts lus' : 'Aucun contact trouvé dans ce fichier', !n); renderOverlay(true); };
  r.readAsText(f);
}

/** Propositions pour un client : d'abord par numéro (sûr), sinon par nom. */
function propositions(c, contacts, pris) {
  const ex = contacts.filter(k => k.t.some(t => c.numeros.includes(t)));
  if (ex.length) return { exact: true, l: ex.slice(0, 3).map(k => ({ k, score: 100, num: k.t.find(t => c.numeros.includes(t)) })) };
  const l = contacts.filter(k => !k.t.some(t => pris[t] && pris[t] !== c.id))
    .map(k => ({ k, score: Math.max(simNom(c.nom, k.n), k.s ? simNom(c.nom, k.s) : 0), num: k.t[0] }))
    .filter(x => x.score >= 55).sort((a, b) => b.score - a.score).slice(0, 3);
  return { exact: false, l };
}
function numerosPris() { const p = {}; D.clients.forEach(c => { c.numeros.concat(c.whatsapp ? [c.whatsapp] : []).forEach(n => p[n] = c.id); }); return p; }
function toutesPropositions() {

  return sansWa().sort((a, b) => act(a.id) - act(b.id)).map(c => ({ c, p: propositions(c, ct.l, pris) })).filter(x => x.p.l.length);
}

  <button class="btn ghost full" style="margin-top:12px" onclick="back()">Terminé</button></div>`;
};
function vListeCartes() {
  const actives = D.cartes.filter(c => c.statut === 'Active'), autres = D.cartes.filter(c => !['Active', 'Supprimée'].includes(c.statut));
  const carte = (ca, i) => {
    const cps = D.comptes.filter(c => c.statut === 'Actif' && c.carte === ca.id), plein = cps.length >= D.params.maxCarte;
    return `<div class="card anim" style="margin-bottom:8px;animation-delay:${i * .04}s;${cps.length > D.params.maxCarte ? 'border-color:rgba(226,87,76,.5)' : ''}">
      <div class="sb"><div class="row">${I('card', '#f6e3a8').replace('<svg', '<svg width="22" height="22"')}<b>${esc(ca.repere)}</b></div>${ca.statut === 'Active' ? `<span class="tag ${plein ? 't-wa' : 't-ok'}">${cps.length}/${D.params.maxCarte}</span>` : tagStat(ca.statut)}</div>
      ${ca.titulaire ? `<div class="mu" style="margin-top:4px">${esc(ca.titulaire)}</div>` : ''}
      ${cps.map(c => `<div class="mu" style="margin-top:6px">• ${esc(c.mail)} (${esc(c.type)})</div>`).join('')}
      ${ca.statut === 'Active' ? `<div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn sm sec" onclick="mCarte('${ca.id}')">Modifier</button><button class="btn sm" onclick="mRemplacer('${ca.id}')">Remplacer</button>${cps.length ? '' : `<button class="btn sm redo" onclick="mSupprimerCarte('${ca.id}')">Supprimer</button>`}</div>` : ''}</div>`;
  };
  return `<div class="grid2 anim" style="margin-top:14px"><div class="card"><div style="font-size:22px;font-weight:600;color:var(--g3)">${actives.length}</div><div class="mu">cartes actives</div></div><div class="card"><div style="font-size:22px;font-weight:600;color:var(--g3)">${D.comptes.filter(c => c.statut === 'Actif' && c.carte).length}</div><div class="mu">comptes reliés</div></div></div>
  <h2>Cartes actives</h2>${actives.map(carte).join('') || '<div class="empty">Aucune carte.</div>'}
  ${autres.length ? `<details class="card" style="margin-top:6px"><summary>Anciennes cartes (${autres.length})</summary><div style="margin-top:10px">${autres.map(carte).join('')}</div></details>` : ''}
  <button class="btn ghost full" style="margin-top:14px" onclick="push('corbeille')">${I('trash').replace('<svg', '<svg width="18" height="18"')} Corbeille</button>
  <h2>Historique des cartes</h2>${D.historique.slice(0, 15).map(h => `<div class="list-item" style="font-size:13px"><div style="flex:1"><b>${esc(h.action)}</b> · ${esc(h.detail)}<div class="mu" style="font-size:11px">${dt(h.date)} · ${esc(IX.ca[h.id] ? IX.ca[h.id].repere : h.id)}</div></div></div>`).join('') || '<div class="mu">Rien pour le moment.</div>'}`;
}
function mCarte(id) {
  const ca = id ? IX.ca[id] : null;
  sheet(`<div class="serif" style="font-size:19px;color:var(--g2);margin-bottom:14px">${ca ? 'Modifier la carte' : 'Nouvelle carte'}</div>
    <label class="l">Repère (jamais le numéro complet)</label><input id="ca_r" placeholder="Ex. Visa Coris …4521" value="${ca ? esc(ca.repere) : ''}">
    <label class="l">Titulaire</label><input id="ca_t" value="${ca ? esc(ca.titulaire) : ''}">
    <label class="l">Notes</label><input id="ca_n" value="${ca ? esc(ca.notes) : ''}">
    <button class="btn full" id="ca_ok">Enregistrer</button>`);
  $('#ca_ok').onclick = async () => { const d = { repere: $('#ca_r').value, titulaire: $('#ca_t').value, notes: $('#ca_n').value }; if (id) d.id = id; try { await act(id ? 'modifierCarte' : 'ajouterCarte', d, 'Carte enregistrée'); closeSheet(); } catch (e) {} };
}
function mRemplacer(id) {
  const ca = IX.ca[id], n = D.comptes.filter(c => c.statut === 'Actif' && c.carte === id).length;
  sheet(`<div class="serif" style="font-size:19px;color:var(--g2)">Remplacer ${esc(ca.repere)}</div><div class="mu" style="margin:4px 0 14px">Ses ${n} compte(s) passeront sur la nouvelle carte. L’ancienne reste dans l’historique.</div>
    <label class="l">Nouvelle carte</label><select id="rc_s" onchange="$('#rc_new').style.display=this.value?'none':'block'"><option value="">➕ Une nouvelle carte</option>${D.cartes.filter(c => c.statut === 'Active' && c.id !== id).map(c => `<option value="${c.id}">${esc(c.repere)} (${D.comptes.filter(x => x.statut === 'Actif' && x.carte === c.id).length}/${D.params.maxCarte})</option>`).join('')}</select>
    <div id="rc_new"><label class="l">Repère</label><input id="rc_r" placeholder="Ex. Visa Ecobank …7788"><label class="l">Titulaire</label><input id="rc_t" value="${esc(ca.titulaire)}"></div>
    <button class="btn full" id="rc_ok">Remplacer</button>`);
  $('#rc_ok').onclick = async () => { const d = { id, nouvelleId: $('#rc_s').value, repere: $('#rc_r').value, titulaire: $('#rc_t').value }; try { await act('remplacerCarte', d, 'Carte remplacée'); closeSheet(); } catch (e) {} };
}
function mSupprimerCarte(id) {
  const ca = IX.ca[id];
  confirmer({ titre: 'Supprimer ' + ca.repere + ' ?', danger: true, icon: 'trash', ok: 'Supprimer', non: 'Garder', texte: 'Aucun compte n’utilise cette carte.', note: 'Elle ira dans la corbeille : tu pourras la restaurer pendant 30 jours.',
    action: () => act('supprimerCarte', { id }, 'Carte dans la corbeille', { undo: () => call('restaurerCarte', { id }) }) });
}
SCREENS.corbeille = function () {
  const lim = Date.now() - 30 * 864e5;
  const cl = D.clients.filter(c => c.statut === 'Supprimé' && new Date(c.supprimeLe).getTime() > lim);
  const ca = D.cartes.filter(c => c.statut === 'Supprimée' && new Date(c.supprimeeLe).getTime() > lim);
  const it = (t, s, f) => `<div class="list-item"><div style="flex:1"><div style="font-weight:600">${esc(t)}</div><div class="mu">${s}</div></div><button class="btn sm sec" onclick="${f}">Restaurer</button></div>`;
  return `${head('Corbeille', 'Les éléments sont gardés 30 jours')}<div style="padding:16px 20px calc(40px + var(--bot))">
  <h2>Clients</h2>${cl.map(c => it(c.nom, 'supprimé le ' + dt(c.supprimeLe), `act('restaurerClient',{id:'${c.id}'},'Client restauré')`)).join('') || '<div class="mu">Vide.</div>'}
  <h2>Cartes</h2>${ca.map(c => it(c.repere, 'supprimée le ' + dt(c.supprimeeLe), `act('restaurerCarte',{id:'${c.id}'},'Carte restaurée')`)).join('') || '<div class="mu">Vide.</div>'}</div>`;
};

/* ═════════ GAINS ═════════ */
const MC = { janvier: 'janv', 'février': 'févr', mars: 'mars', avril: 'avr', mai: 'mai', juin: 'juin', juillet: 'juil', 'août': 'août', septembre: 'sept', octobre: 'oct', novembre: 'nov', 'décembre': 'déc' };
function vGains() {
  const G = D.gains.slice(0, GPERIOD), g = G[GSEL] || G[0] || {}, b = D.business;
  const mx = Math.max(1, ...G.map(x => x.benefice));
  const bars = G.slice().reverse().map((x, i, a) => { const idx = a.length - 1 - i; return `<div class="b ${idx === GSEL ? 'on' : ''}" onclick="GSEL=${idx};FIRST=true;render()"><i data-h="${Math.max(4, Math.round(Math.max(0, x.benefice) / mx * 118))}px"></i><span>${esc(MC[x.mois.split(' ')[0]] || x.mois.slice(0, 4))}</span></div>`; }).join('');
  return `<div class="sb anim"><div class="serif" style="font-size:22px;color:var(--g2);letter-spacing:1px">Gains</div><div class="row">${eyeBtn()}<div class="seg" style="padding:3px"><button class="${GPERIOD === 6 ? 'on' : ''}" style="padding:0 12px;min-height:32px" onclick="GPERIOD=6;GSEL=0;FIRST=true;render()">6 mois</button><button class="${GPERIOD === 12 ? 'on' : ''}" style="padding:0 12px;min-height:32px" onclick="GPERIOD=12;GSEL=0;FIRST=true;render()">Année</button></div></div></div>
  <div class="anim" style="margin-top:18px"><div style="font-size:12px;color:#c9b77a;letter-spacing:1px">BÉNÉFICE NET · ${esc(String(g.mois || '').toUpperCase())}</div>
  <div class="big" style="font-size:40px;margin-top:4px">${CU(g.benefice)}</div><div class="mu">${M(g.encaisse)} encaissés − ${M(g.depenses)} de comptes</div></div>
  <div class="bars anim" style="margin-top:18px;animation-delay:.05s">${bars}</div>
  <div class="grid3 anim" style="margin-top:12px;animation-delay:.1s">
    <div class="card" style="padding:12px"><div style="font-weight:600;color:var(--ok)">${g.taux != null ? g.taux + ' %' : '—'}</div><div class="mu" style="font-size:11px">renouvellent</div></div>
    <div class="card" style="padding:12px"><div style="font-weight:600">${MASK ? '•••••' : '≈ ' + F(b.prevision.attendu)}</div><div class="mu" style="font-size:11px">attendu 30 j</div></div>
    <div class="card" style="padding:12px"><div style="font-weight:600">${g.ventes || 0}</div><div class="mu" style="font-size:11px">ventes</div></div>
  </div>
  <div class="mu" style="margin-top:8px">${g.nouveaux || 0} nouveaux · ${g.renouvellements || 0} renouvellements · ${g.retours || 0} retours · ${g.departs || 0} départs${g.recu > g.encaisse && !MASK ? ' · frais ajoutés : ' + F(g.recu - g.encaisse) : ''}</div>
  ${vSante(b.sante)}
  <h2>Rentabilité par compte</h2>
  ${b.rentabilite.map(r => `<div class="list-item"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis">${esc(r.mail.split('@')[0])}</div><div class="mu" style="font-size:11px">${r.occupees}/${r.places} payées${r.impayes ? ` · <span style="color:var(--wa)">${r.impayes} impayée(s)</span>` : ''}${r.vides ? ' · ' + r.vides + ' vide(s)' : ''} · ${esc(r.type)}</div></div><div style="font-weight:600;font-size:14px;color:${r.profit >= 0 ? 'var(--ok)' : 'var(--ko)'}">${MASK ? '•••' : (r.profit >= 0 ? '+ ' : '− ') + F(Math.abs(r.profit))}</div></div>`).join('') || '<div class="mu">Aucun compte.</div>'}
  <h2>Par type</h2>
  ${Object.keys(g.parType || {}).map(t => { const v = g.parType[t], top = Math.max(1, ...Object.values(g.parType).map(x => x.encaisse)); return `<div style="margin-bottom:12px"><div class="sb" style="font-size:13px"><span>${esc(t)}</span><span style="color:var(--g2);font-weight:600">${M(v.encaisse)}</span></div><div class="bar" style="margin-top:6px;height:8px"><i data-w="${v.encaisse / top * 100}%" style="background:linear-gradient(90deg,#c9a24a,#f6e3a8)"></i></div><div class="mu" style="font-size:11px;margin-top:4px">${v.ventes} vente(s)</div></div>`; }).join('') || '<div class="mu">Pas encore de ventes ce mois-ci.</div>'}`;
}


function vSante(h) {
  if (!h) return '';
  const col = h.score >= 75 ? 'var(--ok)' : h.score >= 55 ? 'var(--g2)' : 'var(--wa)';
  const tile = (v, t, c) => `<div class="card" style="padding:12px"><div style="font-weight:600;font-size:16px;${c ? 'color:' + c : ''}">${v}</div><div class="mu" style="font-size:11px;line-height:1.35">${t}</div></div>`;
  const ev = (h.evolution || []).slice().reverse(), mx = Math.max(1, ...ev.map(e => Math.max(e.nouveaux, e.departs)));
  const conseils = [];
  if (h.partisApres1 != null && h.partisApres1 >= 40) conseils.push(`<b>${h.partisApres1} %</b> de tes clients partis ne sont restés qu'un mois. Un rappel chaleureux 3 jours avant la fin du 1er mois peut en garder une partie.`);
  if (h.impayees) conseils.push(`<b>${h.impayees}</b> place(s) occupée(s) par des clients qui n'ont pas payé : elles te coûtent sans rien rapporter.`);
  if (h.aRetirer) conseils.push(`<b>${h.aRetirer}</b> client(s) ont dépassé leur délai : relance-les avec le lien de paiement avant de les retirer.`);
  if (h.solde < 0) conseils.push(`Ce mois-ci, tu perds plus de clients (${h.departs30}) que tu n'en gagnes (${h.nouveaux30}).`);
  if (h.occupation < 80 && h.placesLibres) conseils.push(`${h.placesLibres} place(s) libre(s) : chaque place remplie, c'est environ ${MASK ? '•••' : F(h.panier)} de plus par mois.`);
  if (!conseils.length) conseils.push('Tout va bien : continue comme ça ✨');
  return `<h2>Santé du business</h2>
  <div class="card gold anim" style="display:flex;gap:16px;align-items:center">
    <div style="width:76px;height:76px;border-radius:50%;flex:none;padding:4px;background:conic-gradient(${col} 0 ${h.score}%,#2a2a2a 0 100%)"><div style="width:100%;height:100%;border-radius:50%;background:#151515;display:flex;align-items:center;justify-content:center;flex-direction:column"><b style="font-size:22px;color:${col}">${h.score}</b><span class="mu" style="font-size:9px">/ 100</span></div></div>
    <div style="flex:1"><div class="serif" style="font-size:18px;color:${col}">${esc(h.niveau)}</div><div class="mu" style="line-height:1.45">${h.actifs} clients actifs · ${h.occupation} % des places payées · ${h.fideles} fidèle(s) depuis 6 mois ou plus</div></div>
  </div>
  <div class="grid2 anim" style="margin-top:10px;animation-delay:.05s">
    ${tile(h.vie != null ? h.vie + ' mois' : '—', 'durée de vie moyenne d’un client' + (h.viePartis != null ? ` (ceux qui partent : ${h.viePartis} mois)` : ''))}
    ${tile(MASK ? '•••••' : F(h.valeur), 'ce que te rapporte un client sur toute sa durée')}
    ${tile(`<span style="color:var(--ok)">+${h.nouveaux30}</span> / <span style="color:var(--ko)">−${h.departs30}</span>`, 'arrivées / départs sur 30 jours')}
    ${tile(h.churn != null ? h.churn + ' %' : '—', 'des clients partis ces 30 derniers jours', h.churn != null && h.churn > 25 ? 'var(--wa)' : '')}
    ${tile(MASK ? '•••••' : F(h.panier), 'panier moyen par client et par mois')}
    ${tile(MASK ? '•••••' : F(h.revenuMensuel), 'revenu mensuel des clients actifs')}
  </div>
  <div class="card anim" style="margin-top:10px;animation-delay:.1s"><div class="sb" style="font-size:12px"><b>Arrivées et départs</b><span class="mu"><span style="color:var(--ok)">■</span> arrivées <span style="color:var(--ko)">■</span> départs</span></div>
    <div style="display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:10px">${ev.map(e => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="display:flex;align-items:flex-end;gap:3px;height:70px"><i style="display:block;width:9px;border-radius:3px;background:var(--ok);height:${Math.max(2, e.nouveaux / mx * 70)}px" title="${e.nouveaux}"></i><i style="display:block;width:9px;border-radius:3px;background:var(--ko);height:${Math.max(2, e.departs / mx * 70)}px" title="${e.departs}"></i></div><span class="mu" style="font-size:10px">${esc(MC[e.mois.split(' ')[0]] || '')}</span></div>`).join('')}</div></div>
  <div class="card anim" style="margin-top:10px;animation-delay:.15s"><b style="font-size:13px;color:var(--g3)">Mes conseils</b>${conseils.map(t => `<div style="font-size:13px;line-height:1.5;margin-top:8px">• ${t}</div>`).join('')}</div>
  ${h.top.length ? `<div class="card anim" style="margin-top:10px"><b style="font-size:13px">Tes clients les plus fidèles</b>${h.top.map(f => `<button class="tap sb" style="width:100%;background:none;border:0;color:inherit;padding:8px 0;cursor:pointer" onclick="push('client',['${f.id}'])"><span>${esc(f.nom)}</span><span class="tag t-ok">${f.mois} mois</span></button>`).join('')}</div>` : ''}
  ${h.total && h.importes / h.total > .3 ? `<div class="mu" style="margin-top:8px;line-height:1.45">ℹ️ Pour tes clients importés de tes notes, l'app ne connaît que le dernier paiement : la durée de vie est donc sous-estimée pour l'instant et deviendra plus juste chaque mois.</div>` : ''}`;
}

function relancer(el, id) {
  const a = D.business.anciens.find(x => x.id === id), msg = ($('#rl_m').value || '').replace(/\{prénom\}/g, (a.nom || '').split(' ')[0]);
  el.href = `https://wa.me/${D.params.indicatif}${a.whatsapp}?text=${encodeURIComponent(msg + (a.paiement ? '\n👉 Payer en un geste : ' + a.paiement : ''))}`;
  call('relance', { id }).then(() => refresh(true)).catch(() => {});
}

async function verifierMaj() {
  try { busy(true); const r = await call('miseAJour'); busy(false);
    if (r && r.installee) { toast('Version ' + r.version + ' installée ✨'); setTimeout(() => refresh(true), 70000); }
    else toast('Tu as déjà la dernière version (' + (D.version || '') + ')');
  } catch (e) { busy(false); toast(/Action inconnue/.test(String(e)) ? 'Colle d’abord Code.gs 2.3 dans Google (voir le guide)' : String(e), true); }
}
SCREENS.parametres = function () {
  if (!window._REG) { call('reglages').then(r => { window._REG = r; renderOverlay(); }).catch(e => toast(String(e), true)); return `${head('Réglages du système')}<div class="wrap"><div class="sk" style="height:300px"></div></div>`; }
  const R = window._REG, oui = k => String(R[k] || 'oui').toLowerCase() !== 'non';
  const sw = (k, t, s) => `<label class="list-item" style="cursor:pointer"><div style="flex:1"><div style="font-weight:600">${t}</div><div class="mu">${s}</div></div><input type="checkbox" id="rg_${k}" ${oui(k) ? 'checked' : ''} style="width:24px;height:24px;margin:0;accent-color:#d4af37"></label>`;
  const nb = (k, t) => `<div><label class="l">${t}</label><input id="rg_${k}" inputmode="numeric" value="${esc(R[k] || '')}"></div>`;
  return `${head('Réglages du système', 'Enregistrés dans ton tableau Google')}<div style="padding:16px 20px calc(40px + var(--bot))">
  <h2 style="margin-top:4px">Notifications (OneSignal)</h2>
  <label class="l">App ID</label><input id="rg_ONESIGNAL_APP_ID" autocapitalize="off" placeholder="ex. 1a2b3c4d-…" value="${esc(R.ONESIGNAL_APP_ID || '')}">
  <label class="l">Clé API REST ${R.ONESIGNAL_API_KEY ? '(déjà enregistrée : laisse tel quel pour la garder)' : ''}</label><input id="rg_ONESIGNAL_API_KEY" autocapitalize="off" placeholder="Colle ta clé ici" value="${esc(R.ONESIGNAL_API_KEY || '')}">
  ${sw('NOTIF_EMAIL', 'Recevoir aussi les e-mails', 'Pour chaque paiement et les rappels du matin')}
  <h2>Automatisation</h2>
  ${sw('VALIDATION_AUTO', 'Validation automatique', 'Renouvellements sans ambiguïté validés seuls (annulables 24 h)')}
  <h2>Délais et montants</h2>
  <div class="grid2">${nb('GRACE_JOURS', 'Jours de grâce')}${nb('RAPPEL_CLIENT_JOURS', 'Rappel client (jours avant)')}${nb('RAPPEL_COMPTE_JOURS', 'Rappel compte (jours avant)')}${nb('MARGE', 'Marge de frais acceptée (F)')}</div>
  <label class="l">Ton numéro Orange Money de dépôt (affiché dans les rappels)</label><input id="rg_NUMERO_DEPOT" inputmode="tel" value="${esc(R.NUMERO_DEPOT || '')}">
  <label class="l">Code de paiement Orange Money ({numero} et {montant} sont remplacés)</label><input id="rg_USSD_PAIEMENT" autocapitalize="off" value="${esc(R.USSD_PAIEMENT || '*144*2*1*{numero}*{montant}#')}">
  <div class="mu" style="margin:-6px 0 12px">Utilisé pour le lien « Payer en un geste » dans les rappels.</div>
  <button class="btn full" onclick="sauverReg()">Enregistrer</button>
  <button class="btn sec full" style="margin-top:8px" onclick="act('testNotif',{},'Notification de test envoyée')">Envoyer une notification de test</button>
  </div>`;
};
async function sauverReg() {
  const g = k => { const el = $('#rg_' + k); return el.type === 'checkbox' ? (el.checked ? 'oui' : 'non') : el.value; };
  const d = {}; ['ONESIGNAL_APP_ID', 'ONESIGNAL_API_KEY', 'NOTIF_EMAIL', 'VALIDATION_AUTO', 'GRACE_JOURS', 'RAPPEL_CLIENT_JOURS', 'RAPPEL_COMPTE_JOURS', 'MARGE', 'NUMERO_DEPOT', 'USSD_PAIEMENT'].forEach(k => d[k] = g(k));
  try { busy(true); window._REG = await call('sauverReglages', d); busy(false); toast('Réglages enregistrés'); renderOverlay(); refresh(true); } catch (e) { busy(false); toast(String(e), true); }
}
function deconnexion() {
  confirmer({ titre: 'Se déconnecter ?', texte: 'Tu devras recoller ton lien et recréer ton code.', danger: true, icon: 'back', ok: 'Se déconnecter',
    action: () => { ['cfg', 'cache', 'pin', 'fid'].forEach(LS.del); location.hash = ''; location.reload(); } });
}

/* ═════════ NOTIFICATIONS (OneSignal) ═════════ */
let osInit = false;
function chargerOneSignal() {
  if (osInit || !D || !D.notif.appId) return Promise.resolve(false);
  osInit = true;
  return new Promise(res => {
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    const base = location.pathname.replace(/[^/]*$/, '');
    window.OneSignalDeferred.push(async OS => {
      try { await OS.init({ appId: D.notif.appId, serviceWorkerPath: base.slice(1) + 'OneSignalSDKWorker.js', serviceWorkerParam: { scope: base }, notifyButton: { enable: false } }); window._OS = OS; res(true); }
      catch (e) { res(false); }
    });
    const s = document.createElement('script'); s.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js'; s.defer = true; document.head.appendChild(s);
  });
}
async function activerNotifs() {
  if (!D.notif.appId) return sheet(`<div class="serif" style="font-size:19px;color:var(--g2)">Notifications à configurer</div><div style="font-size:14px;line-height:1.5;margin-top:10px">Crée ton compte OneSignal, puis colle l'<b>App ID</b> et la <b>clé API</b> dans <b>Réglages → Réglages du système</b>.</div><button class="btn full" style="margin-top:14px" onclick="closeSheet();push('parametres')">Ouvrir les réglages</button><div></div>`);
  if (!navigator.standalone && !matchMedia('(display-mode: standalone)').matches) return toast("Ouvre l'app depuis son icône sur l'écran d'accueil pour activer les notifications.", true);
  await chargerOneSignal();
  try { await window._OS.Notifications.requestPermission(); setTimeout(renderOverlay, 800); if (Notification.permission === 'granted') toast('Notifications activées'); } catch (e) { toast('Impossible d’activer les notifications : ' + e, true); }
}

/* ═════════ VERROUILLAGE ═════════ */
async function hash(s) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('iconic:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 0; for (const c of 'iconic:' + s) h = (h * 31 + c.charCodeAt(0)) | 0; return 'x' + h; }
}
let PIN = '', PINMODE = 'unlock', PIN1 = '', ESSAIS = 0, BLOQUE = 0, PROC = false, PENDING = [];
function rejouer() { PROC = false; const p = PENDING; PENDING = []; p.forEach(n => tape(n)); }
function lockScreen(mode, msg) {
  PINMODE = mode; PIN = '';
  const titre = { unlock: 'Saisis ton code', create: 'Crée ton code à 4 chiffres', confirm: 'Confirme ton code', old: 'Code actuel' }[mode];
  const fid = LS.get('fid', null) && mode === 'unlock';
  $('#lockbox').innerHTML = `<div class="lock"><div class="gem"></div><div class="serif" style="font-size:30px;letter-spacing:7px;color:var(--g2);margin-top:32px">ICONIC</div><div style="font-size:10px;letter-spacing:8px;color:var(--g);margin-top:4px">COLLECTION</div>
    <div style="font-size:14px;color:var(--mu);margin-top:36px">${titre}</div>${msg ? `<div style="font-size:12.5px;color:var(--ko);margin-top:6px">${esc(msg)}</div>` : ''}
    <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button onclick="tape('${n}')">${n}</button>`).join('')}
    <button class="t" onclick="${fid ? 'faceId()' : mode === 'unlock' ? 'codeOublie()' : "''"}">${fid ? 'Face ID' : mode === 'unlock' ? 'Oublié ?' : ''}</button><button onclick="tape('0')">0</button><button class="t" aria-label="Effacer" onclick="PIN=PIN.slice(0,-1);dots()">⌫</button></div></div>`;
  if (fid) setTimeout(faceId, 300);
}
function dots() { document.querySelectorAll('#dots span').forEach((s, i) => s.classList.toggle('on', i < PIN.length)); }
async function tape(n) {
  if (Date.now() < BLOQUE) return toast('Trop d’essais. Patiente quelques secondes.', true);
  if (PROC) { PENDING.push(n); return; }
  if (PIN.length >= 4) return; PIN += n; dots();
  if (PIN.length < 4) return;
  PROC = true;
  await new Promise(r => setTimeout(r, 120));
  const h = await hash(PIN);
  if (PINMODE === 'unlock') {
    if (h === LS.get('pin', '')) { ESSAIS = 0; PROC = false; PENDING = []; unlock(); }
    else { ESSAIS++; if (ESSAIS >= 5) { BLOQUE = Date.now() + 30000; ESSAIS = 0; } shakeErr(); }
  } else if (PINMODE === 'old') {
    if (h === LS.get('pin', '')) { lockScreen('create'); rejouer(); } else shakeErr();
  } else if (PINMODE === 'create') { PIN1 = h; lockScreen('confirm'); rejouer(); }
  else if (PINMODE === 'confirm') {
    if (h === PIN1) { LS.set('pin', h); PROC = false; PENDING = []; toast('Code enregistré'); unlock(); } else { lockScreen('create', 'Les deux codes sont différents. Recommence.'); rejouer(); }
  }
}
function shakeErr() { const d = $('#dots'); d.classList.add('shake'); if (navigator.vibrate) navigator.vibrate(200); setTimeout(() => { d.classList.remove('shake'); PIN = ''; dots(); PENDING = []; PROC = false; }, 420); }
let LOCKED = true, hiddenAt = 0;
function unlock() {
  LOCKED = false; const l = $('#lockbox .lock');
  if (l) { l.style.transition = 'opacity .35s'; l.style.opacity = 0; setTimeout(() => $('#lockbox').innerHTML = '', 350); }
  FIRST = true; render(); renderOverlay(); refresh(true);
}
function changerCode() { lockScreen('old'); }
function codeOublie() {
  confirmer({ titre: 'Code oublié ?', texte: 'Pour ta sécurité, il faut te reconnecter avec ton lien personnel (dans l’e-mail « Tes liens ICONIC »), puis créer un nouveau code.', ok: 'Me reconnecter', icon: 'lock',
    action: () => { ['cfg', 'cache', 'pin', 'fid'].forEach(LS.del); location.reload(); } });
  $('#modal .mbg').style.zIndex = 95;
}
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))), unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function toggleFaceId() {
  if (LS.get('fid', null)) { LS.del('fid'); toast('Face ID désactivé'); return renderOverlay(); }
  try {
    const c = await navigator.credentials.create({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'ICONIC' }, user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'iconic', displayName: 'ICONIC' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' }, timeout: 60000 } });
    LS.set('fid', b64(c.rawId)); toast('Face ID activé'); renderOverlay();
  } catch (e) { toast('Face ID indisponible sur cet appareil.', true); }
}
async function faceId() {
  try {
    await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: unb64(LS.get('fid')) }], userVerification: 'required', timeout: 60000 } });
    unlock();
  } catch (e) { /* l'utilisateur tape son code */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (CFG && LS.get('pin', null)) {
    if (!LOCKED && hiddenAt && Date.now() - hiddenAt > 60000) { LOCKED = true; lockScreen('unlock'); }
    else if (!LOCKED && D) refresh(true);
  }
});

/* ═════════ CONNEXION ═════════ */
function vConnexion(msg) {
  $('#nav').style.display = 'none';
  $('#main').innerHTML = `<div class="wrap" style="padding-top:calc(60px + var(--top))"><div style="display:flex;flex-direction:column;align-items:center"><div class="gem"></div><div class="serif" style="font-size:28px;letter-spacing:7px;color:var(--g2);margin-top:30px">ICONIC</div><div style="font-size:10px;letter-spacing:8px;color:var(--g);margin-top:4px">COLLECTION</div></div>
  <div class="card gold" style="margin-top:34px"><div class="serif" style="font-size:18px;color:var(--g2)">Bienvenue</div><p style="font-size:14px;line-height:1.5">Colle ici <b>le lien de ton application</b>, reçu par e-mail, qui contient <b>?k=</b>.</p>
  <textarea id="cx_l" rows="4" placeholder="https://script.google.com/macros/s/…/exec?k=…"></textarea>
  ${msg ? `<div style="color:var(--ko);font-size:13.5px;margin-bottom:12px">${esc(msg)}</div>` : ''}
  <button class="btn full" onclick="connexion()">Se connecter</button></div></div>`;
}
async function connexion() {
  const brut = $('#cx_l').value.trim(), m = brut.match(/https?:\/\/\S+?\/exec\?k=[A-Za-z0-9]+/);
  if (!m) return vConnexion("Ce lien n'est pas valide : il doit contenir « /exec?k= ».");
  const u = new URL(m[0]), cfg = { url: u.origin + u.pathname, key: u.searchParams.get('k') };
  busy(true);
  try { D = await call('load', {}, cfg); CFG = cfg; LS.set('cfg', cfg); LS.set('cache', D); indexer(); busy(false); lockScreen('create'); }
  catch (e) { busy(false); vConnexion(String(e)); }
}

/* ═════════ DÉMARRAGE ═════════ */
(function demarrer() {
  const fin = () => { const s = $('#splash'); s.style.opacity = 0; setTimeout(() => s.remove(), 500); };
  setTimeout(fin, 1100);
  try { if ('serviceWorker' in navigator) { const base = location.pathname.replace(/[^/]*$/, ''); navigator.serviceWorker.register(base + 'OneSignalSDKWorker.js', { scope: base }).catch(() => {}); } } catch (e) {}
  if (!CFG) return vConnexion();
  D = LS.get('cache', null);
  if (D) indexer();
  if (!LS.get('pin', null)) { lockScreen('create'); } else lockScreen('unlock');
  call('load').then(d => { appliquer(d); chargerOneSignal(); })
    .catch(e => { if (String(e).indexOf('Accès refusé') >= 0) { LS.del('cfg'); CFG = null; $('#lockbox').innerHTML = ''; vConnexion("Ta clé n'est plus valide."); } else if (!D) toast(String(e), true); });
  call('app', { url: location.origin + location.pathname }).catch(() => {});
})();
</script>
