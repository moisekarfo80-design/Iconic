<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ICONIC">
<meta name="theme-color" content="#000000">
<title>ICONIC</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="Image%20PNG.png">
<link rel="icon" href="Image%20PNG.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--c1:#121212;--c2:#181818;--ln:#262626;--lg:#3a3115;--g:#d4af37;--g2:#f3dfa2;--g3:#f6e3a8;--tx:#ededed;--mu:#a3a3a3;--ok:#7fd6a3;--wa:#f0b65a;--ko:#ff8a80;--red:#e2574c;--top:env(safe-area-inset-top);--bot:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#000}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button,a{font-family:inherit}
.serif{font-family:Cinzel,Georgia,serif}
.mu{color:var(--mu);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.sb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wrap{padding:calc(14px + var(--top)) 20px calc(110px + var(--bot));max-width:640px;margin:0 auto}
h2{font-family:Cinzel,Georgia,serif;color:var(--g2);font-size:16px;letter-spacing:1px;font-weight:600;margin:22px 0 10px}
.card{background:var(--c1);border:1px solid var(--ln);border-radius:16px;padding:14px}
.card.gold{border-color:var(--lg)}
.hero{border-radius:22px;padding:16px 18px;background:linear-gradient(150deg,#2a210a 0%,#121212 58%);border:1px solid var(--lg);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,240,190,.08) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.2s .5s ease-out}
.big{font-family:Cinzel,Georgia,serif;color:var(--g3);font-size:36px;line-height:1.15}
.ib{width:44px;height:44px;flex:none;border-radius:14px;background:#141414;border:1px solid #2b2410;display:flex;align-items:center;justify-content:center;position:relative;color:var(--g2);cursor:pointer}
.ib svg{width:20px;height:20px}
.badge{position:absolute;top:-5px;right:-5px;background:var(--g);color:#111;font-size:11px;font-weight:700;border-radius:10px;padding:2px 6px;animation:pulse 2s infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 14px;border-radius:12px;border:0;background:linear-gradient(135deg,#f6e3a8,#c9a24a);color:#111;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;transition:transform .12s}
.btn:active,.ib:active,.tap:active{transform:scale(.96)}
.btn.sec{background:transparent;color:var(--g2);border:1px solid var(--lg)}
.btn.ghost{background:transparent;color:#d6d6d6;border:1px solid #2f2f2f}
.btn.red{background:var(--red);color:#fff}
.btn.redo{background:transparent;color:var(--ko);border:1px solid rgba(226,87,76,.5)}
.btn.wa{background:#25d366;color:#05230f}
.btn.full{width:100%;min-height:52px;border-radius:16px;font-size:15px}
.btn.sm{min-height:38px;padding:8px 12px;font-size:13px;border-radius:10px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--lg);color:var(--g2);white-space:nowrap}
.t-ok{color:var(--ok);border-color:rgba(79,191,131,.4)}.t-wa{color:var(--wa);border-color:rgba(232,163,61,.45)}.t-ko{color:var(--ko);border-color:rgba(226,87,76,.45)}.t-bl{color:#8fb4ff;border-color:rgba(143,180,255,.4)}
.task{display:flex;align-items:center;gap:12px;background:var(--c1);border:1px solid var(--ln);border-radius:16px;padding:10px 12px;margin-bottom:8px;transition:transform .35s,opacity .35s,max-height .35s,margin .35s,padding .35s;max-height:120px;overflow:hidden}
.task.out{transform:translateX(110%);opacity:0;max-height:0;margin:0;padding-top:0;padding-bottom:0;border-width:0}
.ico{width:40px;height:40px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ico svg{width:20px;height:20px}
.av{width:44px;height:44px;flex:none;border-radius:50%;background:#1a1a1a;color:var(--g2);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
.av.g{background:linear-gradient(135deg,#f6e3a8,#c9a24a);color:#111}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #1d1d1d}
.list-item:first-child{border-top:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:8px 14px;border-radius:20px;border:1px solid #2f2f2f;background:transparent;color:#cfcfcf;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:rgba(212,175,55,.14);border-color:var(--g);color:var(--g3)}
.seg{display:flex;gap:4px;padding:4px;background:var(--c1);border:1px solid var(--ln);border-radius:14px}
.seg button{flex:1;white-space:nowrap;min-height:38px;border-radius:10px;border:0;background:transparent;color:#8a8a8a;font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:#2a210a;color:var(--g3)}
input,select,textarea{width:100%;background:#0c0c0c;border:1px solid var(--lg);color:var(--tx);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;margin:4px 0 12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g)}
label.l{display:block;font-size:12px;color:var(--mu);letter-spacing:.3px}
.bar{height:6px;border-radius:6px;background:#262626;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--g);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.anim{animation:fadeUp .5s both}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;height:calc(78px + var(--bot));padding-bottom:var(--bot);background:rgba(0,0,0,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid #2b2410;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;padding-top:9px}
nav button{background:none;border:0;color:#8a8a8a;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav button.on{color:var(--g2)}
nav svg{width:22px;height:22px}
.fab{width:58px;height:58px;margin:-26px auto 0;border-radius:20px;transform:rotate(45deg);border:0;background:linear-gradient(135deg,#f6e3a8,#c9a24a);box-shadow:0 8px 24px rgba(212,175,55,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s}
.fab:active{transform:rotate(45deg) scale(.92)}
.fab svg{transform:rotate(-45deg);width:24px;height:24px}
#ov{position:fixed;inset:0;z-index:20;pointer-events:none}
.screen{position:absolute;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;pointer-events:auto;animation:slideIn .32s cubic-bezier(.2,.8,.2,1)}
.screen.closing{animation:slideOut .25s ease-in forwards}
.shead{display:flex;align-items:center;gap:12px;padding:calc(12px + var(--top)) 20px 0}
.mbg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:640px;max-height:90vh;overflow-y:auto;background:#111;border-top:1px solid var(--g);border-radius:26px 26px 0 0;padding:12px 20px calc(28px + var(--bot));animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet.danger{border-top-color:var(--red)}
.grab{width:40px;height:5px;border-radius:5px;background:#333;margin:0 auto 16px}
.toast{position:fixed;left:16px;right:16px;top:calc(10px + var(--top));z-index:60;background:#1c1c1c;border:1px solid var(--lg);border-radius:16px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.6);animation:down .3s;max-width:600px;margin:0 auto}
.toast.err{border-color:var(--red)}
.toast .in{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:14px}
.toast .pg{height:3px;background:#262626}.toast .pg i{display:block;height:3px;background:var(--g);width:100%}
.acces{background:#0b0b0b;border:1px dashed var(--g);border-radius:14px;padding:12px;font-size:14px;-webkit-user-select:text;user-select:text}
.acces div{padding:3px 0}
.sk{border-radius:16px;background:linear-gradient(90deg,#141414 25%,#1e1e1e 50%,#141414 75%);background-size:200% 100%;animation:shimmer 1.3s infinite}
.place{border-radius:16px;padding:14px;min-height:96px;background:var(--c1);border:1px solid var(--lg);cursor:pointer;transition:transform .12s}
.place:active{transform:scale(.97)}
.place.free{background:rgba(79,191,131,.07);border-color:rgba(79,191,131,.35)}
.place.prep{background:transparent;border:1px dashed rgba(232,163,61,.6)}
.place.warn{border-color:rgba(232,163,61,.6)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--g)}
.dot.p{animation:pulse 1.6s infinite}
.bars{height:170px;display:flex;align-items:flex-end;gap:10px;padding:14px 14px 0;background:#101010;border:1px solid var(--ln);border-radius:18px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;cursor:pointer}
.bars .b i{width:100%;border-radius:8px 8px 3px 3px;background:#3a3115;height:0;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.bars .b.on i{background:linear-gradient(180deg,#f6e3a8,#c9a24a);box-shadow:0 0 18px rgba(212,175,55,.35)}
.bars .b span{font-size:11px;color:var(--mu);padding-bottom:10px}
.spark path.l{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s .2s ease-out forwards}
.spark circle{animation:pulse 1.8s 1.4s infinite;opacity:0;animation-fill-mode:forwards}
.swipe{position:relative;height:62px;border-radius:31px;background:#141414;border:1px solid var(--lg);display:flex;align-items:center;justify-content:center;color:#c9b77a;font-size:14px;overflow:hidden;touch-action:none}
.swipe .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(212,175,55,.15);width:0}
.swipe .knob{position:absolute;left:6px;top:6px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#f6e3a8,#c9a24a);display:flex;align-items:center;justify-content:center;cursor:grab;z-index:2}
.swipe .lbl{animation:glow 2.4s infinite}
.lock{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 28%,#2a210a 0%,#070707 55%);display:flex;flex-direction:column;align-items:center;padding-top:calc(70px + var(--top))}
.gem{width:54px;height:54px;border:2px solid var(--g);transform:rotate(45deg);background:radial-gradient(circle at 35% 35%,#fff7d6,#e7c66a 25%,#7a5c14 60%,#120d02 85%);box-shadow:0 0 40px rgba(212,175,55,.55);animation:gem 2.4s ease-in-out infinite}
.gem.sm{width:22px;height:22px;box-shadow:0 0 14px rgba(212,175,55,.45)}
.dots{display:flex;gap:16px;margin-top:16px}
.dots span{width:14px;height:14px;border-radius:50%;border:1.5px solid #6b5a22;transition:all .15s}
.dots span.on{background:var(--g);border-color:var(--g);transform:scale(1.15)}
.dots.shake{animation:shake .4s}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:18px 28px;margin-top:36px}
.pad button{width:72px;height:72px;border-radius:50%;font-size:26px;color:#f3f3f3;background:rgba(255,255,255,.06);border:1px solid #2b2410;cursor:pointer}
.pad button:active{background:rgba(212,175,55,.25)}
.pad button.t{background:transparent;border:0;font-size:13px;color:#c9b77a}
.splash{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
.splash .word{font-family:Cinzel,serif;font-size:30px;letter-spacing:8px;color:var(--g2);margin-top:34px;animation:fadeUp .8s .2s both}
.splash .sub{font-size:10px;letter-spacing:8px;color:var(--g);margin-top:6px;animation:fadeUp .8s .4s both}
.check{width:120px;height:120px;position:relative;margin:0 auto}
.check .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--g);box-shadow:0 0 50px rgba(212,175,55,.45);animation:pop .5s both}
.check path{stroke-dasharray:90;stroke-dashoffset:90;animation:draw .6s .35s ease-out forwards}
.check .sp{position:absolute;width:7px;height:7px;background:var(--g3);transform:rotate(45deg);opacity:0;animation:spark .9s .5s ease-out forwards}
.empty{text-align:center;color:var(--mu);padding:26px 10px;font-size:14px}
.cu{font-variant-numeric:tabular-nums}
.masked{letter-spacing:2px}
details summary{cursor:pointer;color:var(--g2);font-size:13.5px;list-style:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{from{transform:translateY(-140%)}}
@keyframes slideIn{from{transform:translateX(100%)}}
@keyframes slideOut{to{transform:translateX(100%)}}
@keyframes shine{to{transform:translateX(100%)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.75}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes gem{0%,100%{box-shadow:0 0 30px rgba(212,175,55,.45)}50%{box-shadow:0 0 55px rgba(255,225,140,.8)}}
@keyframes pop{from{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}to{transform:scale(1);opacity:1}}
@keyframes spark{0%{opacity:0;transform:translate(0,0) rotate(45deg) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(45deg) scale(1)}}
@keyframes glow{0%,100%{opacity:.65}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="splash" id="splash"><div class="gem"></div><div class="word">ICONIC</div><div class="sub">COLLECTION</div></div>
<div id="main"></div>
<nav id="nav" style="display:none"></nav>
<div id="ov"></div>
<div id="modal"></div>
<div id="lockbox"></div>

<script>
/* ═════════ ICONIC Collection · application v2 ═════════ */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('iconic_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('iconic_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('iconic_' + k); } catch (e) {} }
};
let CFG = LS.get('cfg', null);
let D = null, IX = {}, TAB = (location.hash || '').replace('#', '') || 'accueil';
let MASK = LS.get('masque', false), FIRST = true, STACK = [], GPERIOD = 6, GSEL = 0, CFILTRE = 'actifs', RECH = '', CSEG = 'comptes';
if (!['accueil', 'clients', 'comptes', 'gains', 'valider'].includes(TAB)) TAB = 'accueil';

/* ---------- outils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => String(Math.round(Number(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const F = n => num(n) + ' F';
const M = n => MASK ? '<span class="masked">••••• F</span>' : F(n);
const CU = (n, pre) => MASK ? '<span class="masked">••••• F</span>' : `<span class="cu" data-v="${Math.round(Number(n || 0))}" data-pre="${pre || ''}">${pre || ''}${F(n)}</span>`;
const dt = iso => { if (!iso) return '—'; const d = new Date(iso); if (isNaN(d)) return '—'; return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear(); };
const dtl = iso => { if (!iso) return '—'; const d = new Date(iso); const m = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.']; return d.getUTCDate() + ' ' + m[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
const jours = j => j === 0 ? "aujourd'hui" : j > 0 ? `dans ${j} j` : `il y a ${-j} j`;
const ini = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0] || '').join('').toUpperCase();
const daysTo = iso => iso ? Math.round((new Date(iso) - new Date(D.aujourdhui)) / 864e5) : null;
const todayIso = () => new Date().toISOString().slice(0, 10);
const isoDay = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toISOString().slice(0, 10); };
const icons = {
  diamond: '<path d="M12 3l8 9-8 9-8-9z"/>', users: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M16 5a3 3 0 0 1 0 6M18 14c2 .6 3 2.7 3 6"/>',
  box: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 4v5"/>', chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', inbox: '<path d="M4 13h4l2 3h4l2-3h4"/><path d="M5 5h14l1 8v6H4v-6z"/>', search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  back: '<path d="M15 5l-7 7 7 7"/>', eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff: '<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/>',
  userx: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M16 11h6"/>', card: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',
  wa: '<path d="M4 20l1.3-4A8 8 0 1 1 8 19z"/>', edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>', key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>',

/* ---------- serveur ---------- */
async function call(action, data, cfg) {
  cfg = cfg || CFG;
  let res;
  try { res = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ key: cfg.key, action, data: data || {} }) }); }
  catch (e) { throw 'Pas de connexion. Vérifie Internet et réessaie.'; }
  let j;
  try { j = await res.json(); } catch (e) { throw 'Réponse inattendue du serveur. As-tu déployé la nouvelle version du code ?'; }
  if (!j.ok) throw j.erreur || 'Erreur';
  return j.data;
}
function indexer() {
  IX = { cl: {}, cp: {}, pl: {}, ca: {}, ab: {}, se: {} };
  D.clients.forEach(x => IX.cl[x.id] = x); D.comptes.forEach(x => IX.cp[x.id] = x); D.places.forEach(x => IX.pl[x.id] = x);
  D.cartes.forEach(x => IX.ca[x.id] = x); D.abos.forEach(x => IX.ab[x.id] = x); D.sessions.forEach(x => IX.se[x.code] = x);
}
let loading = null;
async function refresh(quiet) {
  if (!CFG) return;
  if (loading) return loading;
  loading = (async () => {
    try {
      D = await call('load');
      LS.set('cache', D);
      indexer(); render(); renderOverlay();
    } catch (e) {
      if (String(e).indexOf('Accès refusé') >= 0) { LS.del('cfg'); CFG = null; return vConnexion("Ta clé n'est plus valide. Colle à nouveau ton lien."); }
      if (!quiet || !D) toast(String(e), true);
    } finally { loading = null; }
  })();
  return loading;
}
async function act(action, data, msg, opts) {
  opts = opts || {};
  busy(true);
  try {
    const r = await call(action, data);
    busy(false);
    if (opts.undo) undoToast(msg, opts.undo); else if (msg) toast(msg);
    refresh(true);
    return r;
  } catch (e) { busy(false); toast(String(e), true); throw e; }
}
let busyEl = null, busyT = null;
function busy(on) {
  clearTimeout(busyT);
  if (on) busyT = setTimeout(() => { if (!busyEl) { busyEl = document.createElement('div'); busyEl.className = 'mbg'; busyEl.style.alignItems = 'center'; busyEl.style.zIndex = 70; busyEl.innerHTML = '<div class="gem sm" style="width:30px;height:30px"></div>'; document.body.appendChild(busyEl); } }, 250);
  else if (busyEl) { busyEl.remove(); busyEl = null; }
}

/* ---------- toasts et annulation ---------- */
let toastEl = null, toastT = null;
function toast(msg, err) {
  clearTimeout(toastT); if (toastEl) toastEl.remove();
  toastEl = document.createElement('div'); toastEl.className = 'toast' + (err ? ' err' : '');
  toastEl.innerHTML = `<div class="in">${I(err ? 'warn' : 'check', err ? '#ff8a80' : '#7fd6a3').replace('<svg', '<svg width="20" height="20"')}<span style="flex:1">${esc(msg)}</span></div>`;
  document.body.appendChild(toastEl);
  const el = toastEl; toastT = setTimeout(() => el.remove(), err ? 5000 : 2600);
}
function undoToast(msg, fn) {
  clearTimeout(toastT); if (toastEl) toastEl.remove();
  const el = document.createElement('div'); el.className = 'toast'; toastEl = el;
  el.innerHTML = `<div class="in">${I('check', '#7fd6a3').replace('<svg', '<svg width="20" height="20"')}<span style="flex:1">${esc(msg)}</span><button class="btn sec sm" style="border:0;color:var(--g3);font-weight:700">ANNULER</button></div><div class="pg"><i></i></div>`;
  document.body.appendChild(el);
  const bar = el.querySelector('.pg i'); bar.animate([{ width: '100%' }, { width: '0%' }], { duration: 10000, easing: 'linear' });
  el.querySelector('button').onclick = async () => { el.remove(); try { busy(true); await fn(); busy(false); toast('Action annulée'); refresh(true); } catch (e) { busy(false); toast(String(e), true); } };
  toastT = setTimeout(() => el.remove(), 10000);
}

function back() {

}

/* ---------- animations ---------- */
function after(root) {
  root = root || document;
  root.querySelectorAll('.cu').forEach(el => {
    const v = Number(el.dataset.v), pre = el.dataset.pre || '';
    if (!FIRST && el.dataset.done) return;
    const t0 = performance.now(), dur = 900;
    const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = pre + F(v * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step); el.dataset.done = 1;
  });
  requestAnimationFrame(() => setTimeout(() => {
    root.querySelectorAll('[data-h]').forEach((el, i) => { el.style.transitionDelay = (i * 70) + 'ms'; el.style.height = el.dataset.h; });
    root.querySelectorAll('[data-w]').forEach(el => el.style.width = el.dataset.w);
  }, 40));
}

function bindSwipe() {
  const sw = $('#sw'); if (!sw || sw.dataset.b) return; sw.dataset.b = 1;
  const k = sw.querySelector('.knob'), f = sw.querySelector('.fill');
  let x0 = null, max = 0;
  const pos = x => { const d = Math.max(0, Math.min(max, x)); k.style.transform = `translateX(${d}px)`; f.style.width = (d + 56) + 'px'; return d; };
  k.addEventListener('pointerdown', e => { x0 = e.clientX; max = sw.clientWidth - 62; k.setPointerCapture(e.pointerId); k.style.transition = 'none'; });
  k.addEventListener('pointermove', e => { if (x0 != null) pos(e.clientX - x0); });
  const end = e => {
    if (x0 == null) return; const d = e.clientX - x0; x0 = null; k.style.transition = 'transform .25s'; f.style.transition = 'width .25s';
    if (d > max * .82) { pos(max); validerCourant(); } else { pos(0); setTimeout(() => f.style.width = '0', 250); }
  };
  k.addEventListener('pointerup', end); k.addEventListener('pointercancel', end);
}

    x += `<h2>${esc(ty)} <span class="mu" style="font-family:Montserrat;letter-spacing:0">· ${lib.libres}/${lib.total} libres</span></h2>`;
    x += l.map((c, i) => { const r = R[c.id] || { occupees: 0, places: c.places, profit: 0 }, d = daysTo(c.expiration);
      return `<button class="tap card anim" style="width:100%;text-align:left;color:inherit;margin-bottom:8px;cursor:pointer;animation-delay:${i * .04}s" onclick="push('compte',['${c.id}'])">

  });
  const autres = D.comptes.filter(c => c.statut !== 'Actif');
  if (!x) x = '<div class="empty">Aucun compte. Ajoute ton premier compte avec « Ajouter ».</div>';
  if (autres.length) x += `<details class="card" style="margin-top:14px"><summary>Comptes fermés ou bloqués (${autres.length})</summary>${autres.map(c => `<div class="sb" style="padding:8px 0;border-top:1px solid #222;margin-top:8px;font-size:13px"><span>${esc(c.mail)}</span>${tagStat(c.statut)}</div>`).join('')}</details>`;

/* ═════════ VERROUILLAGE ═════════ */
async function hash(s) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('iconic:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 0; for (const c of 'iconic:' + s) h = (h * 31 + c.charCodeAt(0)) | 0; return 'x' + h; }
}
let PIN = '', PINMODE = 'unlock', PIN1 = '', ESSAIS = 0, BLOQUE = 0, PROC = false, PENDING = [];
function rejouer() { PROC = false; const p = PENDING; PENDING = []; p.forEach(n => tape(n)); }
function lockScreen(mode, msg) {
  PINMODE = mode; PIN = '';
  const titre = { unlock: 'Saisis ton code', create: 'Crée ton code à 4 chiffres', confirm: 'Confirme ton code', old: 'Code actuel' }[mode];
  const fid = LS.get('fid', null) && mode === 'unlock';
  $('#lockbox').innerHTML = `<div class="lock"><div class="gem"></div><div class="serif" style="font-size:30px;letter-spacing:7px;color:var(--g2);margin-top:32px">ICONIC</div><div style="font-size:10px;letter-spacing:8px;color:var(--g);margin-top:4px">COLLECTION</div>
    <div style="font-size:14px;color:var(--mu);margin-top:36px">${titre}</div>${msg ? `<div style="font-size:12.5px;color:var(--ko);margin-top:6px">${esc(msg)}</div>` : ''}
    <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button onclick="tape('${n}')">${n}</button>`).join('')}
    <button class="t" onclick="${fid ? 'faceId()' : mode === 'unlock' ? 'codeOublie()' : "''"}">${fid ? 'Face ID' : mode === 'unlock' ? 'Oublié ?' : ''}</button><button onclick="tape('0')">0</button><button class="t" aria-label="Effacer" onclick="PIN=PIN.slice(0,-1);dots()">⌫</button></div></div>`;
  if (fid) setTimeout(faceId, 300);
}
function dots() { document.querySelectorAll('#dots span').forEach((s, i) => s.classList.toggle('on', i < PIN.length)); }
async function tape(n) {
  if (Date.now() < BLOQUE) return toast('Trop d’essais. Patiente quelques secondes.', true);
  if (PROC) { PENDING.push(n); return; }
  if (PIN.length >= 4) return; PIN += n; dots();
  if (PIN.length < 4) return;
  PROC = true;
  await new Promise(r => setTimeout(r, 120));
  const h = await hash(PIN);
  if (PINMODE === 'unlock') {
    if (h === LS.get('pin', '')) { ESSAIS = 0; PROC = false; PENDING = []; unlock(); }
    else { ESSAIS++; if (ESSAIS >= 5) { BLOQUE = Date.now() + 30000; ESSAIS = 0; } shakeErr(); }
  } else if (PINMODE === 'old') {
    if (h === LS.get('pin', '')) { lockScreen('create'); rejouer(); } else shakeErr();
  } else if (PINMODE === 'create') { PIN1 = h; lockScreen('confirm'); rejouer(); }
  else if (PINMODE === 'confirm') {
    if (h === PIN1) { LS.set('pin', h); PROC = false; PENDING = []; toast('Code enregistré'); unlock(); } else { lockScreen('create', 'Les deux codes sont différents. Recommence.'); rejouer(); }
  }
}
function shakeErr() { const d = $('#dots'); d.classList.add('shake'); if (navigator.vibrate) navigator.vibrate(200); setTimeout(() => { d.classList.remove('shake'); PIN = ''; dots(); PENDING = []; PROC = false; }, 420); }
let LOCKED = true, hiddenAt = 0;
function unlock() {
  LOCKED = false; const l = $('#lockbox .lock');
  if (l) { l.style.transition = 'opacity .35s'; l.style.opacity = 0; setTimeout(() => $('#lockbox').innerHTML = '', 350); }
  FIRST = true; render(); renderOverlay(); refresh(true);
}

    action: () => { ['cfg', 'cache', 'pin', 'fid'].forEach(LS.del); location.reload(); } });

}
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))), unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function toggleFaceId() {
  if (LS.get('fid', null)) { LS.del('fid'); toast('Face ID désactivé'); return renderOverlay(); }
  try {
    const c = await navigator.credentials.create({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'ICONIC' }, user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'iconic', displayName: 'ICONIC' },

    LS.set('fid', b64(c.rawId)); toast('Face ID activé'); renderOverlay();

}

/* ═════════ DÉMARRAGE ═════════ */
(function demarrer() {
  const fin = () => { const s = $('#splash'); s.style.opacity = 0; setTimeout(() => s.remove(), 500); };
  setTimeout(fin, 1100);
  if (!CFG) return vConnexion();
  D = LS.get('cache', null);
  if (D) indexer();
  if (!LS.get('pin', null)) { lockScreen('create'); } else lockScreen('unlock');
  call('load').then(d => { D = d; LS.set('cache', D); indexer(); if (!LOCKED) { render(); renderOverlay(); } chargerOneSignal(); })
    .catch(e => { if (String(e).indexOf('Accès refusé') >= 0) { LS.del('cfg'); CFG = null; $('#lockbox').innerHTML = ''; vConnexion("Ta clé n'est plus valide."); } else if (!D) toast(String(e), true); });
  call('app', { url: location.origin + location.pathname }).catch(() => {});
})();
</script>
